      - Automated Kubernetes deployments via Terraform and Ansible — standardized rollout workflows, improved deploy consistency across dev/test/prod, reduced manual handoff steps.
      - Automated Active-Directory-to-GitHub-Enterprise sync — eliminated manual access-control changes for fleet-wide developer onboarding/offboarding.
      - Managed hybrid DNS infrastructure spanning on-prem and AWS — improved internal-service reliability for cross-environment traffic.
      - Led secrets-store migration from HCL Consul to internal KMS-encrypted secrets backend; established internal YUM repositories for fleet-wide package distribution.
      - Upgraded CloudStack platforms, applied VM patches, and optimized hypervisor performance across production fleet.

