summary: |
  Senior Site Reliability / Release Engineer with 8+ years operating
  production Kubernetes platforms and shipping daily deployments to
  customer-facing apple.com services via Jenkins + Harness pipelines.
  Hands-on with infrastructure-as-code (Terraform, Ansible), high-throughput
  systems (NATS JetStream, Temporal), release-safety tooling (Helm Diff,
  Applitools visual-regression, Aqua + Goldfinch security scans), and
  observability (Prometheus, Grafana, OpenTelemetry, Datadog) across AWS
  and on-prem environments. AWS Certified Solutions Architect
  (Professional + Associate).

# Top of resume — 5 strongest, JD-relevant achievements with real metrics.
# Renders just below the summary as "Selected Engineering Highlights".
key_highlights:
  - Improved NATS JetStream + Temporal pipeline throughput from 245 req/s to 333 req/s (+36%) by implementing a concurrent dispatch model with semaphore-based processing.
  - Validated production reliability across 476,791 events in a 30-minute soak test with zero errors and zero redeliveries — proving end-to-end pipeline correctness under load.
  - Diagnosed a critical ack-floor stall in production where 59,566 messages were stuck for 48+ hours; root-caused, fixed, and added monitoring to prevent recurrence.
  - Proposed and prototyped MAS token caching to reduce IDMS auth load from ~80,000 calls/day to ~3 token refreshes/day — order-of-magnitude reduction in upstream pressure.
  - Led migration of 150 ESXi bare-metal hosts to RHEL8-KVM; designed AWS EKS production clusters with Terraform IaC reducing deployment times by 40%.

experience:
  - company: Apple (via Grid Dynamics LLC)
    title: Release Engineer
    location: Austin, TX
    start: Jun 2025
    end: present
    bullets:
      - Owned release execution and CI/CD reliability for apple.com customer-facing platforms — drove consistent, predictable daily-deploy outcomes across Jenkins and Harness pipelines for tier-1 services.
      - Improved NATS JetStream + Temporal workflow pipeline throughput from 245 req/s to 333 req/s (+36%) by implementing a concurrent dispatch model with semaphore-based processing; validated 476,791 events in a 30-minute soak test with zero errors and zero redeliveries.
      - Diagnosed critical ack-floor stall affecting 59,566 messages stuck 48+ hours in production; root-caused via JetStream consumer instrumentation, deployed fix, and added proactive monitoring to prevent recurrence.
      - Stabilized Harness CI performance — addressed Kyverno pod-spreading issues and 32-CPU runner-node scheduling to improve build reliability and reduce queue times.
      - Proposed MAS token-caching architecture reducing IDMS auth load from ~80K calls/day to ~3 token refreshes/day; coordinated cross-team review.
      - Integrated Applitools visual-regression testing into release pipelines — pre-deploy visual diffs catching customer-facing UI regressions before they reached apple.com production traffic.
      - Hardened release-pipeline security with Aqua container scans and Goldfinch vulnerability gating — blocked non-compliant images from production rollouts and standardized image-trust policies across release-train teams.
      - Adopted Helm Diff in the release-validation step — surfaced unintended chart drift between dev/stage/prod and prevented misconfigured rollouts before they shipped.
      - Coordinated Apollo Federation subgraph schema migrations across federated GraphQL services — managed breaking-change rollouts with downstream consumers via version pinning to prevent customer-facing query failures.
      - Partnered with SRE / SD / Dev teams on incident response, RCA, and post-release verification — running runbooks for on-call coverage and standardizing rollout-validation gates.

